name: Build Windows Installer

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'         # 推 tag 时自动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Pin Tauri npm packages to match Cargo.lock
        shell: bash
        run: |
          TAURI_VER=$(grep -A1 '^name = "tauri"$' src-tauri/Cargo.lock | grep version | sed 's/.*"\(.*\)".*/\1/')
          DIALOG_VER=$(grep -A1 'name = "tauri-plugin-dialog"' src-tauri/Cargo.lock | grep version | sed 's/.*"\(.*\)".*/\1/')
          echo "Pinning @tauri-apps/api to $TAURI_VER"
          echo "Pinning @tauri-apps/plugin-dialog to $DIALOG_VER"
          pnpm add "@tauri-apps/api@$TAURI_VER" "@tauri-apps/plugin-dialog@$DIALOG_VER"

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
