name: Build Windows Installer

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'         # 推 tag 时自动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --bundles msi,nsis
        env:
          RUST_LOG: "debug"

      - name: Show WiX artifacts on failure
        if: failure()
        shell: pwsh
        run: |
          $wixDir = "src-tauri/target/release/wix"
          # Print generated wxs (contains actual component definitions)
          Get-ChildItem -Recurse -Filter "*.wxs" -Path $wixDir -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }
          # Re-run light.exe manually with -v to get full error output
          $light = "$env:USERPROFILE\AppData\Local\tauri\WixTools314\light.exe"
          $wixobj = Get-ChildItem -Recurse -Filter "*.wixobj" -Path $wixDir -ErrorAction SilentlyContinue
          if ((Test-Path $light) -and $wixobj) {
            Write-Host "=== Re-running light.exe ==="
            $outMsi = "$wixDir\diag.msi"
            $locFiles = Get-ChildItem -Recurse -Filter "*.wxl" -Path $wixDir -ErrorAction SilentlyContinue
            $locArgs = $locFiles | ForEach-Object { "-loc"; $_.FullName }
            & $light -v -nologo $wixobj.FullName $locArgs -out $outMsi 2>&1
          }

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-web-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-web-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
